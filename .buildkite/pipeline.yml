env:
  SEGMENT_CONTEXTS: "aws-credentials,ecr"

steps:
  - label: ":docker: retrieve imager binary"
    key: "retrieve-imager"
    env:
      IMAGER_VERSION: "v1.7.0-5-gb691a67"
    commands: |
      aws --region us-west-2 ecr get-login-password | docker login --username AWS --password-stdin 528451384384.dkr.ecr.us-west-2.amazonaws.com
      docker pull 528451384384.dkr.ecr.us-west-2.amazonaws.com/imager:$${IMAGER_VERSION}
      imager_id=$$(docker create 528451384384.dkr.ecr.us-west-2.amazonaws.com/imager:$${IMAGER_VERSION})
      docker cp $$imager_id:/usr/local/bin/imager ./imager
      docker rm -v $$imager_id
    artifact_paths:
      - imager

  - label: ":docker: build and push docker image"
    key: "docker-build-push"
    depends_on:
      - retrieve-imager
    env:
      SEGMENT_CONTEXTS: "aws-credentials,ecr"
    commands: |
      buildkite-agent artifact download imager .
      chmod +x imager
      mv imager /usr/local/bin
      aws --region us-west-2 ecr get-login-password | docker login --username AWS --password-stdin 528451384384.dkr.ecr.us-west-2.amazonaws.com
      assume_role_cmds=$$(aws sts assume-role \
        --role-arn arn:aws:iam::528451384384:role/buildkite-agent \
        --role-session-name "buildkite-$${BUILDKITE_PIPELINE_SLUG}-$${BUILDKITE_BUILD_NUMBER}" \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text | awk '{printf "export AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s AWS_SECURITY_TOKEN=%s", $$1, $$2, $$3, $$3}')
      eval "$$assume_role_cmds"
      aws --region us-west-2 ecr get-login-password | docker login --username AWS --password-stdin 528451384384.dkr.ecr.us-west-2.amazonaws.com
      echo "Building and pushing docker image"
      SHORT_COMMIT=$${BUILDKITE_COMMIT:0:7}
      if [ "$$BUILDKITE_BRANCH" = "main" ]; then
        imager buildpush . -f Dockerfile --repository terraform-provider-kubeapply -d 528451384384:us-west-2 --build-arg "VERSION_REF=$${BUILDKITE_COMMIT}" --extra-tag "latest"
      else
        imager buildpush . -f Dockerfile --repository terraform-provider-kubeapply -d 528451384384:us-west-2 --build-arg "VERSION_REF=$${BUILDKITE_COMMIT}" --extra-tag "$${SHORT_COMMIT}"
      fi
